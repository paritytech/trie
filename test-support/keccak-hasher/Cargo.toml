[package]
name = "keccak-hasher"
# NOTE: do not bump this version. `parity-crate-owner` does not own this crate
# on crates.io yet, so the release workflow cannot publish a new version of it.
# If a bump is unavoidable it has to be published by hand.
version = "0.16.0"
authors = ["Parity Technologies <admin@parity.io>"]
description = "Keccak-256 implementation of the Hasher trait"
repository = "https://github.com/paritytech/parity/"
license = "Apache-2.0"
edition = "2018"

[dependencies]
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
hash-db = { path = "../../hash-db", default-features = false, version = "0.16.0" }
hash256-std-hasher = { path = "../../hash256-std-hasher", version = "0.15.2" }

[features]
default = ["std"]
std = [
  "hash-db/std",
]
